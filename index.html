<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E9EEF6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Разговорник</title>
  <style>
    :root {
      --md-bg: #F7F9FC;
      --md-surface: #F7F9FC;
      --md-surface-low: #F0F4F9;
      --md-surface-container: #E9EEF6;
      --md-surface-high: #FFFFFF;
      --md-ink: #1A1C1E;
      --md-muted: #44474E;
      --md-outline: #74777F;
      --md-outline-variant: #C4C7C5;
      --md-primary: #0B57D0;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #D3E3FD;
      --md-on-primary-container: #041E49;
      --md-secondary-container: #C2E7FF;
      --md-on-secondary-container: #001D35;
      --md-tertiary-container: #FFDAD6;
      --md-on-tertiary-container: #410002;
      --md-error: #BA1A1A;
      --scale: 1;
      --font: "Roboto", "Google Sans", system-ui, -apple-system, sans-serif;
      --mono: "Roboto Mono", ui-monospace, monospace;
      --elev-1: 0 1px 2px rgba(0,0,0,.08), 0 1px 3px 1px rgba(0,0,0,.04);
      --elev-3: 0 4px 8px 3px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.08);
    }

    :root[data-theme="dark"] {
      --md-bg: #111318;
      --md-surface: #111318;
      --md-surface-low: #191C20;
      --md-surface-container: #1D2024;
      --md-surface-high: #282A2F;
      --md-ink: #E2E2E6;
      --md-muted: #C4C6D0;
      --md-outline: #8E9099;
      --md-outline-variant: #44474E;
      --md-primary: #A8C7FA;
      --md-on-primary: #062E6F;
      --md-primary-container: #0842A0;
      --md-on-primary-container: #D3E3FD;
      --md-secondary-container: #004A77;
      --md-on-secondary-container: #C2E7FF;
      --md-tertiary-container: #93000A;
      --md-on-tertiary-container: #FFDAD6;
      --md-error: #FFB4AB;
      --elev-1: 0 1px 3px rgba(0,0,0,.35);
      --elev-3: 0 6px 16px rgba(0,0,0,.5);
    }

    html[data-size="big"] { --scale: 1.16; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0;
      background: #E1E5EC; color: var(--md-ink);
      font-family: var(--font); font-size: 16px; line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    :root[data-theme="dark"] body { background: #0B0C0E; }

    body { min-height: 100dvh; display: flex; justify-content: center; }

    .app {
      width: 100%; max-width: 412px; min-height: 100dvh;
      display: flex; flex-direction: column;
      background: var(--md-bg);
      box-shadow: 0 16px 48px rgba(0,0,0,.16);
      position: relative;
      transition: background-color .25s ease, color .25s ease;
    }
    @media (max-width: 480px) { .app { max-width: 100%; box-shadow: none; } }

    /* ---------- Material 3 Top App Bar ---------- */
    .m3-topbar {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px; padding: 8px 12px 8px 16px;
      background: var(--md-surface-container);
      color: var(--md-ink);
      transition: background-color .25s ease;
    }
    .m3-nav-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .m3-title-wrap { min-width: 0; }
    .m3-title {
      font-size: 20px; font-weight: 500; letter-spacing: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .m3-subtitle { font-size: 12px; color: var(--md-muted); line-height: 1.1; }
    .m3-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .m3-icon-btn {
      width: 40px; height: 40px; border-radius: 20px; border: 0;
      background: transparent; color: var(--md-ink);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; font: inherit; font-weight: 600; font-size: 14px;
    }
    .m3-icon-btn:hover { background: rgba(128,128,128,.1); }
    .m3-icon-btn.is-active { background: var(--md-primary-container); color: var(--md-on-primary-container); }

    .m3-lang-chip {
      height: 34px; padding: 0 12px; border-radius: 17px; border: 0;
      background: var(--md-primary-container); color: var(--md-on-primary-container);
      font: inherit; font-size: 13px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    }
    .m3-lang-chip:active { opacity: .82; }

    /* ---------- Content ---------- */
    .view { flex: 1 1 auto; padding: 16px 16px 104px; }

    h1 {
      margin: 0 0 6px;
      font-size: calc(28px * var(--scale)); font-weight: 400; line-height: 1.2;
      letter-spacing: -0.01em; color: var(--md-ink);
    }
    .lead { margin: 0 0 16px; font-size: calc(14px * var(--scale)); color: var(--md-muted); }

    /* Material 3 Search Bar */
    .m3-search {
      display: flex; align-items: center; gap: 12px;
      height: 48px; padding: 0 14px 0 16px;
      border-radius: 24px;
      background: var(--md-surface-high);
      box-shadow: var(--elev-1);
      margin-bottom: 14px;
    }
    .m3-search input {
      flex: 1; border: 0; background: transparent; color: var(--md-ink);
      font: inherit; font-size: 16px; outline: none; min-width: 0;
    }
    .m3-search input::placeholder { color: var(--md-muted); }
    .m3-search-clear {
      width: 28px; height: 28px; border-radius: 14px; border: 0;
      background: transparent; color: var(--md-muted);
      display: none; align-items: center; justify-content: center; cursor: pointer;
    }
    .m3-search-clear.visible { display: inline-flex; }

    /* Material 3 Filter Chips */
    .m3-chips {
      display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
      margin: 0 -16px 16px; padding: 2px 16px;
    }
    .m3-chips::-webkit-scrollbar { display: none; }
    .m3-chip {
      flex: 0 0 auto; height: 32px; padding: 0 14px; border-radius: 8px;
      border: 1px solid var(--md-outline-variant);
      background: transparent; color: var(--md-muted);
      font: inherit; font-size: 13.5px; font-weight: 500;
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease;
    }
    .m3-chip.is-active {
      background: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
      border-color: transparent;
    }

    /* Material 3 Tonal Cards Grid */
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .m3-card {
      display: flex; flex-direction: column; gap: 10px;
      text-align: left; padding: 14px;
      background: var(--md-surface-high);
      border: 0;
      box-shadow: var(--elev-1);
      border-radius: 16px;
      color: inherit; font: inherit; cursor: pointer;
      transition: background-color .15s ease, transform .12s ease;
      min-height: 112px;
    }
    .m3-card:active { transform: scale(.98); background: var(--md-surface-container); }

    .tile-icon {
      width: 38px; height: 38px; border-radius: 12px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .tile-icon svg { width: 20px; height: 20px; }
    .tile-title { font-size: calc(15px * var(--scale)); font-weight: 500; line-height: 1.25; }
    .tile-hint { font-size: calc(12.5px * var(--scale)); line-height: 1.3; color: var(--md-muted); margin-top: 2px; }

    /* Tonal Banner */
    .m3-banner {
      margin-top: 16px; padding: 14px 16px; border-radius: 16px;
      background: var(--md-primary-container); color: var(--md-on-primary-container);
      font-size: calc(13.5px * var(--scale)); line-height: 1.4;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .m3-banner svg { flex-shrink: 0; margin-top: 2px; }

    /* Detail Hero & Assist Chips */
    .hero { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .hero .tile-icon { width: 48px; height: 48px; border-radius: 14px; }
    .hero-title { margin: 0; font-size: calc(22px * var(--scale)); font-weight: 500; }
    .hero-sub { margin: 2px 0 0; font-size: calc(13.5px * var(--scale)); color: var(--md-muted); }

    .map-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .m3-assist-chip {
      height: 36px; padding: 0 14px; border-radius: 8px;
      border: 1px solid var(--md-outline-variant);
      background: var(--md-surface-high); color: var(--md-primary);
      font: inherit; font-size: 13.5px; font-weight: 500; text-decoration: none;
      display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    }
    .m3-assist-chip.filled {
      background: var(--md-primary); color: var(--md-on-primary); border-color: transparent;
    }

    /* Phrase Cards List (Material 3 List Items) */
    .phrase-list { display: grid; gap: 10px; }
    .m3-phrase-card {
      width: 100%; text-align: left; padding: 14px 16px;
      border-radius: 16px; border: 0;
      background: var(--md-surface-high); box-shadow: var(--elev-1);
      color: inherit; font: inherit; cursor: pointer;
      display: grid; gap: 4px;
      transition: background-color .15s ease;
    }
    .m3-phrase-card:active { background: var(--md-surface-container); }
    .phrase-ru { font-size: calc(13px * var(--scale)); color: var(--md-muted); }
    .phrase-main { font-size: calc(18px * var(--scale)); font-weight: 500; line-height: 1.3; }
    .phrase-tr { font-size: calc(13.5px * var(--scale)); color: var(--md-primary); font-weight: 500; }
    .phrase-lat { font-size: calc(12.5px * var(--scale)); color: var(--md-muted); font-style: italic; }

    /* Material 3 Outlined Text Fields */
    .m3-form { display: grid; gap: 12px; margin-bottom: 16px; }
    .m3-field {
      position: relative;
      border: 1px solid var(--md-outline);
      border-radius: 12px;
      padding: 8px 14px;
      background: var(--md-surface-high);
      transition: border-color .15s ease;
    }
    .m3-field:focus-within { border-color: var(--md-primary); border-width: 2px; padding: 7px 13px; }
    .m3-field label {
      display: block; font-size: 12px; color: var(--md-muted); font-weight: 500; margin-bottom: 2px;
    }
    .m3-field:focus-within label { color: var(--md-primary); }
    .m3-field input {
      width: 100%; border: 0; background: transparent; color: var(--md-ink);
      font: inherit; font-size: calc(16px * var(--scale)); outline: none;
    }

    .btn-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .m3-btn {
      flex: 1; height: 44px; border-radius: 22px; border: 0;
      font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .m3-btn-filled { background: var(--md-primary); color: var(--md-on-primary); }
    .m3-btn-tonal { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }

    /* Medical Preview Card */
    .m3-preview-card {
      background: var(--md-surface-high); border-radius: 16px;
      border: 0; box-shadow: var(--elev-1); overflow: hidden;
    }
    .m3-preview-head {
      padding: 12px 16px; background: var(--md-tertiary-container);
      color: var(--md-on-tertiary-container);
      font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
      display: flex; align-items: center; gap: 8px;
    }
    .m3-kv-row {
      display: flex; justify-content: space-between; gap: 16px;
      padding: 12px 16px; border-top: 1px solid var(--md-outline-variant);
      font-size: calc(14.5px * var(--scale));
    }
    .m3-kv-row:first-child { border-top: 0; }
    .m3-kv-row dt { color: var(--md-muted); }
    .m3-kv-row dd { margin: 0; font-weight: 500; text-align: right; }

    /* Settings */
    .m3-section-title {
      margin: 20px 4px 8px; font-size: 13px; font-weight: 500;
      color: var(--md-primary); letter-spacing: .01em;
    }
    .m3-list-card {
      background: var(--md-surface-high); border-radius: 16px;
      border: 0; box-shadow: var(--elev-1); overflow: hidden;
    }
    .m3-list-item {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 16px; min-height: 56px;
      border-top: 1px solid var(--md-outline-variant);
      width: 100%; background: transparent; border-left: 0; border-right: 0; border-bottom: 0;
      color: inherit; font: inherit; text-align: left;
    }
    .m3-list-item:first-child { border-top: 0; }
    .m3-list-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .m3-list-sub { font-size: 12.5px; color: var(--md-muted); font-family: var(--mono); word-break: break-all; }

    /* Material 3 Switch */
    .m3-switch {
      width: 52px; height: 32px; border-radius: 16px;
      border: 2px solid var(--md-outline); background: var(--md-surface-container);
      position: relative; cursor: pointer; padding: 0; flex-shrink: 0;
      transition: background-color .2s ease, border-color .2s ease;
    }
    .m3-switch::after {
      content: ""; position: absolute; top: 6px; left: 6px;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--md-outline); transition: transform .2s ease, width .2s ease, height .2s ease, top .2s ease;
    }
    .m3-switch[aria-checked="true"] { background: var(--md-primary); border-color: var(--md-primary); }
    .m3-switch[aria-checked="true"]::after {
      width: 24px; height: 24px; top: 2px;
      background: var(--md-on-primary); transform: translateX(18px);
    }

    /* Material 3 Navigation Bar (Bottom) */
    .m3-navbar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      max-width: 412px; margin: 0 auto; height: 80px;
      background: var(--md-surface-container);
      display: grid; grid-template-columns: repeat(3, 1fr);
      padding: 10px 8px 12px;
    }
    .m3-nav-item {
      border: 0; background: none; color: var(--md-muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
    }
    .m3-nav-pill {
      width: 64px; height: 32px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: background-color .2s ease;
    }
    .m3-nav-item.is-active { color: var(--md-ink); font-weight: 600; }
    .m3-nav-item.is-active .m3-nav-pill {
      background: var(--md-secondary-container); color: var(--md-on-secondary-container);
    }

    /* Material 3 Bottom Sheet */
    .sheet { position: fixed; inset: 0; z-index: 90; display: flex; align-items: flex-end; justify-content: center; }
    .sheet[hidden] { display: none; }
    .sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
    .sheet-panel {
      position: relative; width: 100%; max-width: 412px; max-height: 82dvh; overflow: auto;
      background: var(--md-surface-high); border-radius: 28px 28px 0 0;
      padding: 12px 16px 28px; box-shadow: var(--elev-3);
      animation: slideUp .22s cubic-bezier(.2, .85, .3, 1);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .m3-drag-handle { width: 32px; height: 4px; border-radius: 2px; background: var(--md-outline); opacity: .45; margin: 0 auto 14px; }
    .sheet-title { font-size: 18px; font-weight: 500; margin-bottom: 8px; padding: 0 4px; }
    .sheet-section { padding: 12px 4px 6px; font-size: 12px; font-weight: 600; color: var(--md-primary); text-transform: uppercase; }
    .lang-item {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border: 0; background: transparent; color: inherit; font: inherit;
      border-radius: 12px; cursor: pointer; text-align: left;
    }
    .lang-item.is-active { background: var(--md-secondary-container); color: var(--md-on-secondary-container); font-weight: 600; }

    .overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
      background: rgba(0,0,0,.5);
    }
    .overlay[hidden] { display: none; }
    .overlay-sheet {
      width: 100%; max-width: 412px; min-height: 42vh;
      background: var(--md-surface-high); color: var(--md-ink);
      border-radius: 28px 28px 0 0; padding: 12px 24px 36px;
      box-shadow: var(--elev-3); animation: slideUp .22s cubic-bezier(.2, .85, .3, 1);
    }
    .overlay-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .overlay-hint { font-size: 12px; font-weight: 500; color: var(--md-muted); }
    .overlay-body { font-size: clamp(24px, 7vw, 34px); font-weight: 500; line-height: 1.25; }
    .overlay-sub { display: block; margin-top: 14px; font-size: 15px; color: var(--md-muted); line-height: 1.45; }
    .overlay-tr { color: var(--md-primary); font-weight: 500; }
    .ov-lat { font-style: italic; }
  </style>
</head>
<body>
  <div class="app">
    <header class="m3-topbar">
      <div class="m3-nav-left">
        <div id="navLeft"></div>
        <div class="m3-title-wrap">
          <div class="m3-title" id="appTitle">Разговорник</div>
          <div class="m3-subtitle" id="appSub">медицинский · 112</div>
        </div>
      </div>
      <div class="m3-actions">
        <button class="m3-lang-chip" id="langBtn" type="button">
          <span id="langCode">RU → SR</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <button class="m3-icon-btn" id="fontBtn" type="button" aria-pressed="false" title="Размер текста">А+</button>
      </div>
    </header>

    <main class="view" id="view"></main>

    <nav class="m3-navbar" aria-label="Навигация">
      <button class="m3-nav-item is-active" data-tab="situations" type="button">
        <span class="m3-nav-pill">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
        </span>
        <span data-tab-label="tabSit">Ситуации</span>
      </button>
      <button class="m3-nav-item" data-tab="card" type="button">
        <span class="m3-nav-pill">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </span>
        <span data-tab-label="tabCard">Моя карточка</span>
      </button>
      <button class="m3-nav-item" data-tab="settings" type="button">
        <span class="m3-nav-pill">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </span>
        <span data-tab-label="tabSettings">Настройки</span>
      </button>
    </nav>
  </div>

  <div class="sheet" id="langSheet" hidden>
    <div class="sheet-backdrop" data-close-sheet></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="m3-drag-handle"></div>
      <div class="sheet-title" id="sheetTitle">Язык</div>
      <div id="langList"></div>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-sheet" id="overlaySheet">
      <div class="m3-drag-handle"></div>
      <div class="overlay-top">
        <span class="overlay-hint" id="overlayHint">Нажмите вне окна, чтобы закрыть</span>
        <button class="m3-icon-btn" id="overlayClose" type="button" aria-label="Закрыть">✕</button>
      </div>
      <div class="overlay-body" id="overlayBody"></div>
    </div>
  </div>

  <script>

window.PHRASEBOOK = {
  version: "0.3.0",
  updated: "2026-11-16",
  languages: {
    sr: { label: "Сербский", native: "Srpski", code: "sr-Latn" }
  },

      <div class="m3-list-card">
        <div class="m3-list-item"><span>${esc(t("countSit"))}</span><span>${DATA.situations.length}</span></div>
        <div class="m3-list-item"><span>${esc(t("countPhr"))}</span><span>${phrases}</span></div>
        <div class="m3-list-item"><span>${esc(t("version"))}</span><span>${esc(DATA.version)} · ${esc(DATA.updated)}</span></div>
        <div class="m3-list-item"><span>${esc(t("net"))}</span><span>${esc(t("netNo"))}</span></div>
      </div>

      <div class="m3-banner">${esc(t("discText"))}</div>

      <div class="m3-section-title">${esc(t("donateTitle"))}</div>
      <div class="m3-list-card">
        ${[["usdt", d.usdt], ["btc", d.btc]].filter(([, c]) => c && c.address).map(([k, c]) => `
          <div class="m3-list-item">
            <div style="min-width:0">
              <div style="font-weight:500">${esc(k.toUpperCase())} · ${esc(c.network)}</div>
              <div class="m3-list-sub">${esc(c.address)}</div>
            </div>
            <button class="m3-assist-chip" type="button" data-copy="${esc(c.address)}">${esc(t("donateCopy"))}</button>
          </div>`).join("")}
      </div>`;
  }

  const langSheet = $("#langSheet"), langList = $("#langList");
  function openLangSheet() {
    $("#sheetTitle").textContent = t("sheetTitle");
    langList.innerHTML =
      `<div class="sheet-section">${esc(t("sheetUi"))}</div>` +
      uiLanguages().map((l) => `<button class="lang-item${l.code === state.ui ? " is-active" : ""}" data-set="ui" data-code="${l.code}"><span>${esc(l.native)}</span><span style="opacity:.65">${esc(l.ru)}</span></button>`).join("") +
      `<div class="sheet-section">${esc(t("sheetPhr"))}</div>` +
      DATA.languages.map((l) => `<button class="lang-item${l.code === state.lang ? " is-active" : ""}" data-set="phr" data-code="${l.code}"><span>${esc(l.native)}</span><span style="opacity:.65">${esc(l.ru)}</span></button>`).join("");
    langSheet.hidden = false;
  }

  function render(keepScroll) {
    applyThemeAndSize();
    const navLeft = $("#navLeft");
    navLeft.innerHTML = (state.tab === "situations" && state.situationId)
      ? `<button class="m3-icon-btn" type="button" data-back aria-label="Назад"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>`
      : "";

    const view = $("#view");
    if (state.tab === "situations") view.innerHTML = state.situationId ? renderSituation(state.situationId) : renderSituations();
    else if (state.tab === "card") view.innerHTML = renderCard();
    else view.innerHTML = renderSettings();

    document.querySelectorAll(".m3-nav-item").forEach((el) => el.classList.toggle("is-active", el.dataset.tab === state.tab));
    document.querySelectorAll("[data-tab-label]").forEach((el) => { el.textContent = t(el.dataset.tabLabel); });
    $("#appTitle").textContent = t("app");
    $("#appSub").textContent = t("medical");
    $("#langCode").textContent = state.ui.toUpperCase() + " → " + state.lang.toUpperCase();
    if (!keepScroll) window.scrollTo({ top: 0, behavior: "auto" });
  }

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-open],[data-phrase],[data-back],[data-tab],[data-tag],[data-show-card],[data-print],#themeSwitch,[data-copy],#sitSearchClear,#langBtn,[data-open-lang]");
    if (!el) return;
    if (el.id === "langBtn" || el.hasAttribute("data-open-lang")) { openLangSheet(); return; }
    if (el.dataset.tag) { state.activeTag = el.dataset.tag; render(true); return; }
    if (el.id === "sitSearchClear") { state.searchQuery = ""; render(true); return; }
    if (el.dataset.tab) { state.tab = el.dataset.tab; if (state.tab !== "situations") state.situationId = null; render(); return; }
    if (el.hasAttribute("data-back")) { state.situationId = null; render(); return; }
    if (el.dataset.open) { state.situationId = el.dataset.open; render(); return; }
    if (el.dataset.phrase != null) {
      const s = DATA.situations.find((x) => x.id === state.situationId);
      if (s) showPhrase(s.id, Number(el.dataset.phrase), s.phrases[Number(el.dataset.phrase)]);
      return;
    }
    if (el.hasAttribute("data-copy")) {
      const txt = el.getAttribute("data-copy");
      const done = () => { const o = el.textContent; el.textContent = t("donateCopied"); setTimeout(() => el.textContent = o, 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done).catch(done); else done();
      return;
    }
    if (el.id === "themeSwitch") { state.theme = state.theme === "dark" ? "light" : "dark"; save(); render(true); return; }
    if (el.hasAttribute("data-show-card")) { showCard(); return; }
    if (el.hasAttribute("data-print")) { window.print(); return; }
  });

  document.addEventListener("input", (e) => {
    if (e.target.id === "sitSearch") {
      state.searchQuery = e.target.value; render(true);
      const n = $("#sitSearch"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
      return;
    }
    const inp = e.target.closest("[data-field]");
    if (!inp) return;
    state.card[inp.dataset.field] = inp.value; save();
    const dl = $("#cardPreview dl");
    if (dl) dl.innerHTML = CARD_FIELDS.map((f) => `<div class="m3-kv-row"><dt>${esc(label(f.key))}</dt><dd>${esc(String(state.card[f.key] || "").trim() || "—")}</dd></div>`).join("");
  });

  $("#fontBtn").addEventListener("click", () => { state.big = !state.big; save(); render(true); });
  langSheet.addEventListener("click", (e) => {
    if (e.target.closest("[data-close-sheet]")) { langSheet.hidden = true; return; }
    const item = e.target.closest("[data-code]");
    if (!item) return;
    if (item.dataset.set === "ui") state.ui = item.dataset.code; else state.lang = item.dataset.code;
    save(); langSheet.hidden = true; render();
  });

  load();
  render();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
    });
  }
})();

  </script>
</body>
</html>
